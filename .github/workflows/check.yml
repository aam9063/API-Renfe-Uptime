name: check

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (linux, make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install prober dependencies
        working-directory: prober
        run: uv sync --frozen
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: make check
        run: make check

  checks-windows:
    name: checks (windows, python scripts/check.py)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install prober dependencies
        working-directory: prober
        run: uv sync --frozen
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: run every check
        run: python scripts/check.py

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: web
        run: pnpm e2e
