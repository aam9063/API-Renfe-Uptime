name: heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  watch:
    name: prober heartbeat
    runs-on: ubuntu-latest
    steps:
      - name: Read the public heartbeat view
        id: heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "The Supabase secrets are not configured yet, nothing to watch."
            echo "state=unconfigured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(curl -sSf \
            "$SUPABASE_URL/rest/v1/v_heartbeat?select=region,last_seen,silent_seconds,is_stale" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$body"
          stale=$(echo "$body" | jq '[.[] | select(.is_stale)] | length')
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "state=checked" >> "$GITHUB_OUTPUT"
      - name: Open an issue when the prober went silent
        if: steps.heartbeat.outputs.state == 'checked' && steps.heartbeat.outputs.stale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Prober silent for more than ten minutes"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open."
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<'BODY'
          The scheduled heartbeat found a probe region whose last write is older than ten minutes.

          That means the page is showing "sin datos" for the affected period, which is the honest
          answer, but nobody is measuring. Check the VPS, the container logs and the runbook:
          `docs/runbook.md`, section "When the prober stops measuring".
          BODY
          )"
