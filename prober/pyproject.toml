[project]
name = "anden9"
version = "0.1.0"
description = "Unofficial uptime prober for the Renfe APIs"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "tzdata>=2026.6",
]

[project.scripts]
anden9 = "anden9.cli:main"

[dependency-groups]
dev = [
  "anyio>=4.16.0",
  "hypothesis>=6.140",
  "import-linter>=2.1",
  "mypy>=1.19",
  "pytest>=8.4",
  "pytest-asyncio>=1.5.0",
  "respx>=0.23.1",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anden9"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "ARG", "PL", "RUF", "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"../scripts/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]

[tool.importlinter]
root_packages = ["anden9"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli on top, domain at the bottom"
type = "layers"
layers = [
  "anden9.cli",
  "anden9.scheduler",
  "anden9.probes | anden9.adapters",
  "anden9.domain",
]

[[tool.importlinter.contracts]]
name = "The domain is pure: no HTTP client, no database, no settings"
type = "forbidden"
source_modules = ["anden9.domain"]
forbidden_modules = [
  "httpx",
  "supabase",
  "pydantic_settings",
  "anden9.adapters",
  "anden9.probes",
  "anden9.scheduler",
  "anden9.cli",
]

[[tool.importlinter.contracts]]
name = "Probes depend on ports, never on adapters or the HTTP library"
type = "forbidden"
source_modules = ["anden9.probes"]
forbidden_modules = ["httpx", "supabase", "anden9.adapters", "anden9.cli", "anden9.scheduler"]

[[tool.importlinter.contracts]]
name = "Adapters are leaves: they know ports, not probes or the CLI"
type = "forbidden"
source_modules = ["anden9.adapters"]
forbidden_modules = ["anden9.probes", "anden9.cli", "anden9.scheduler"]
