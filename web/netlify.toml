[build]
  base = "web"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The SPA owns its routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
